[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-kb-agent"
version = "0.1.0"
description = "可审计的企业知识问答 CLI Agent（合成数据）"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.5", "httpx==0.28.1", "rank-bm25==0.2.2"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
kb-agent = "kb_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kb_agent = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires an explicitly configured real model"]

